name: fridge_meal
description: "냉장고 한 끼 - AI 레시피 추천 앱"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend (Supabase)
  supabase_flutter: ^2.8.0

  # State management (code generation)
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Local storage / offline cache
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0
  flutter_secure_storage: ^9.2.0

  # Model generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.0.0

  # Camera / barcode
  mobile_scanner: ^6.0.0
  permission_handler: ^11.3.0

  # Network state
  connectivity_plus: ^6.0.0

  # Animation
  lottie: ^3.1.0

  # Notifications
  flutter_local_notifications: ^18.0.0
  # workmanager는 v1 embedding API를 사용해 Flutter 최신 버전과 호환되지 않음.
  # 만료 알림은 flutter_local_notifications.zonedSchedule()로 충분.
  # 진짜 백그라운드 워커가 필요해지면 workmanager_plus 등 활성 포크로 교체.

  # UI
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.0

  # Utility
  uuid: ^4.5.0
  intl: ^0.19.0
  sign_in_with_apple: ^8.0.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.6.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  hive_ce_generator: ^1.7.0
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.0

flutter:
  uses-material-design: true

  # Assets (Day 2에 실제 이미지 추가 예정)
  assets:
    - assets/images/ingredients/
    - assets/images/dishes/
    - assets/images/categories/
    - assets/images/pot/
    - assets/images/onboarding/
    - assets/images/splash/
    - assets/images/auth/
    - assets/animations/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Pretendard-Black.otf
          weight: 900
